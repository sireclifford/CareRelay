name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download iOS Simulator runtime
        run: xcodebuild -downloadPlatform iOS

      - name: Create iOS Simulator device
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(r['identifier'] for r in d['runtimes'] if r['platform']=='iOS'))")
          DEVICETYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['identifier'] for t in d['devicetypes'] if 'iPad' in t['name']))")
          DEVICE_UDID=$(xcrun simctl create "CI iPad" "$DEVICETYPE_ID" "$RUNTIME_ID")
          echo "Created device $DEVICE_UDID using $DEVICETYPE_ID / $RUNTIME_ID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"

      - name: List available destinations
        run: xcodebuild -showdestinations -project CareRelay.xcodeproj -scheme CareRelay

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Build
        run: >
          xcodebuild build
          -project CareRelay.xcodeproj
          -scheme CareRelay
          -destination "platform=iOS Simulator,id=$DEVICE_UDID"

      - name: Test
        run: >
          xcodebuild test
          -project CareRelay.xcodeproj
          -scheme CareRelay
          -destination "platform=iOS Simulator,id=$DEVICE_UDIT"
