name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download iOS Simulator runtime
        run: xcodebuild -downloadPlatform iOS

      - name: Run first launch (provision default simulators)
        run: xcodebuild -runFirstLaunch

      - name: List available destinations
        run: xcodebuild -showdestinations -project CareRelay.xcodeproj -scheme CareRelay

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Build
        run: >
          xcodebuild build
          -project CareRelay.xcodeproj
          -scheme CareRelay
          -destination 'platform=iOS Simulator,name=iPad (10th generation)'

      - name: Test
        run: >
          xcodebuild test
          -project CareRelay.xcodeproj
          -scheme CareRelay
          -destination 'platform=iOS Simulator,name=iPad (10th generation)'
